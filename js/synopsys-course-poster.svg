    <text x="185" y="17" fill="#a7f3d0" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">
      SRI SHAKTHI INSTITUTE OF ENGINEERING &amp; TECHNOLOGY
    </text>

    <text x="0" y="65" fill="#6ee7b7" font-family="sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">
