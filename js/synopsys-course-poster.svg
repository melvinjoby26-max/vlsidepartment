    <text x="110" y="115" fill="#ffffff" font-family="monospace" font-size="12" text-anchor="middle">Design Compiler</text>
    <text x="110" y="140" fill="#ffffff" font-family="monospace" font-size="12" text-anchor="middle">Synopsys VCS</text>
