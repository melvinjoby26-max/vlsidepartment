<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <rect width="100%" height="100%" fill="#ffffff" rx="16"/>
  <!-- Decorative border & styling -->
  <rect x="15" y="15" width="270" height="270" fill="none" stroke="#e2e8f0" stroke-width="2" rx="12"/>
  
  <!-- QR Matrix Blocks -->
  <!-- Top-Left Position Detection Pattern -->
  <rect x="35" y="35" width="70" height="70" fill="#1e3a8a" rx="8"/>
  <rect x="47" y="47" width="46" height="46" fill="#ffffff" rx="4"/>
  <rect x="57" y="57" width="26" height="26" fill="#1e3a8a" rx="2"/>

  <!-- Top-Right Position Detection Pattern -->
  <rect x="195" y="35" width="70" height="70" fill="#1e3a8a" rx="8"/>
  <rect x="207" y="47" width="46" height="46" fill="#ffffff" rx="4"/>
  <rect x="217" y="57" width="26" height="26" fill="#1e3a8a" rx="2"/>

  <!-- Bottom-Left Position Detection Pattern -->
  <rect x="35" y="195" width="70" height="70" fill="#1e3a8a" rx="8"/>
  <rect x="47" y="207" width="46" height="46" fill="#ffffff" rx="4"/>
  <rect x="57" y="217" width="26" height="26" fill="#1e3a8a" rx="2"/>

  <!-- Timing Patterns & QR Data Cells -->
  <!-- Horizontal & Vertical Timing Lines -->
  <g fill="#0f172a">
    <rect x="115" y="45" width="10" height="10" rx="2"/>
    <rect x="135" y="45" width="10" height="10" rx="2"/>
    <rect x="155" y="45" width="10" height="10" rx="2"/>
    <rect x="175" y="45" width="10" height="10" rx="2"/>
    
    <rect x="45" y="115" width="10" height="10" rx="2"/>
    <rect x="45" y="135" width="10" height="10" rx="2"/>
    <rect x="45" y="155" width="10" height="10" rx="2"/>
    <rect x="45" y="175" width="10" height="10" rx="2"/>

    <!-- Central Data Grid Simulation -->
    <rect x="115" y="70" width="10" height="20" rx="2"/>
    <rect x="135" y="65" width="20" height="10" rx="2"/>
    <rect x="165" y="75" width="10" height="15" rx="2"/>

    <rect x="85" y="115" width="20" height="10" rx="2"/>
    <rect x="75" y="135" width="10" height="25" rx="2"/>
    <rect x="95" y="145" width="10" height="20" rx="2"/>

    <!-- Center QR Cluster -->
    <rect x="115" y="115" width="70" height="70" fill="#2563eb" rx="10" opacity="0.1"/>
    <!-- Microchip Motif in center -->
    <rect x="125" y="125" width="50" height="50" fill="#1e40af" rx="8"/>
    <rect x="133" y="133" width="34" height="34" fill="#ffffff" rx="4"/>
    <text x="150" y="155" fill="#1e40af" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">VLSI</text>

    <!-- Lower Right Data Blocks -->
    <rect x="115" y="195" width="15" height="15" rx="2"/>
    <rect x="140" y="200" width="10" height="25" rx="2"/>
    <rect x="160" y="195" width="20" height="10" rx="2"/>
    <rect x="135" y="235" width="25" height="10" rx="2"/>
    <rect x="115" y="250" width="15" height="15" rx="2"/>

    <rect x="195" y="115" width="15" height="20" rx="2"/>
    <rect x="220" y="120" width="20" height="10" rx="2"/>
    <rect x="250" y="115" width="15" height="15" rx="2"/>
    <rect x="200" y="145" width="10" height="25" rx="2"/>
    <rect x="220" y="140" width="20" height="10" rx="2"/>
    <rect x="250" y="145" width="15" height="25" rx="2"/>

    <rect x="195" y="195" width="25" height="15" rx="2"/>
    <rect x="230" y="195" width="15" height="15" rx="2"/>
    <rect x="255" y="200" width="10" height="20" rx="2"/>
    <rect x="205" y="220" width="15" height="20" rx="2"/>
    <rect x="230" y="225" width="20" height="10" rx="2"/>
    <rect x="195" y="250" width="30" height="15" rx="2"/>
    <rect x="235" y="245" width="30" height="20" rx="2"/>
  </g>

  <!-- Bottom Label -->
  <text x="150" y="280" fill="#64748b" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.5">SCAN TO REGISTER • SIET EE-VLSI</text>
</svg>
